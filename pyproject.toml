[project]
name = "medication-video-annotation"
version = "0.1.0"
description = "Local video observation, annotation and human review workspace"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "av>=16,<17",
    "pillow>=11,<13",
    "tomli>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false
cache-dir = "local/tooling/uv-cache"
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
